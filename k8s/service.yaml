apiVersion: v1
kind: Service
metadata:
  name: nextjs-devops
  namespace: devops-demo
  labels:
    app.kubernetes.io/name: nextjs-devops
spec:
  # NodePort so minikube can expose it: `minikube service nextjs-devops -n devops-demo`
  type: NodePort
  selector:
    app.kubernetes.io/name: nextjs-devops
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
