# OPTIONAL: autoscaling. Not part of the default deploy.
# Needs the metrics-server addon:  minikube addons enable metrics-server
# Apply with:                      kubectl apply -f k8s/optional/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nextjs-devops
  namespace: devops-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nextjs-devops
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
