apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

# The image used by the Deployment.
# Local minikube: the locally built image (nextjs-devops:local).
# After the first CI run, the pipeline rewrites these two lines to the
# GitHub Container Registry image and the commit SHA, then Argo CD deploys it.
images:
  - name: nextjs-devops
    newName: ghcr.io/sumit-sahni/nextjs-devops
    newTag: 024c3f8
